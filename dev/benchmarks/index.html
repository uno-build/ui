<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>uno/ui · WebGPU benchmark</title>
        <style>
            * { box-sizing: border-box; }
            body { margin: 0; background: #111827; color: #e5e7eb; font: 14px system-ui, sans-serif; }
            main { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 20px; padding: 20px; }
            h1 { font-size: 18px; margin: 0 0 16px; }
            fieldset { border: 0; margin: 0; padding: 0; display: grid; gap: 10px; }
            label { display: grid; gap: 4px; }
            input, select, button { font: inherit; padding: 7px; border: 1px solid #475569; border-radius: 4px; }
            input, select { background: #1e293b; color: inherit; width: 100%; }
            input[type=checkbox] { width: auto; }
            label:has(input[type=checkbox]) { display: block; }
            button { cursor: pointer; }
            button:disabled { cursor: default; opacity: .5; }
            .buttons { display: flex; gap: 8px; margin: 14px 0; flex-wrap: wrap; }
            canvas { display: block; max-width: 100%; height: auto !important; background: #0f172a; }
            pre { white-space: pre-wrap; overflow-wrap: anywhere; background: #1e293b; padding: 12px; font-size: 12px; }
            p { color: #94a3b8; line-height: 1.5; }
            body[data-automation] main { display: block; padding: 0; }
            body[data-automation] aside, body[data-automation] #output { display: none; }
            @media (max-width: 800px) { main { grid-template-columns: 1fr; } }
        </style>
    </head>
    <body>
        <main>
            <aside>
                <h1>uno/ui · WebGPU</h1>
                <form id="controls">
                    <fieldset id="configuration">
                        <label>Workload<select name="workload"><option value="general">General</option><option value="box-shadow">Box shadow</option></select></label>
                        <label>Modo<select name="mode"><option value="performance">Rendimiento</option><option value="capacity">Capacidad</option><option value="stability">Estabilidad</option></select></label>
                        <label>Nodos objetivo<input name="nodes" type="number" min="256" max="50000" value="5000" /></label>
                        <label>Duración (segundos; por escalón en capacidad)<input name="duration" type="number" min="1" max="7200" value="60" /></label>
                        <label>Calentamiento (segundos)<input name="warmup" type="number" min="0" max="120" value="10" /></label>
                        <label>Semilla<input name="seed" type="number" min="0" max="4294967295" value="42" /></label>
                        <label>Repeticiones<input name="repeats" type="number" min="1" max="20" value="1" /></label>
                        <label>FPS objetivo<input name="target_fps" type="number" min="1" max="240" value="60" /></label>
                        <label>Ancho del canvas<input name="width" type="number" min="640" max="3840" value="1280" /></label>
                        <label>Alto del canvas<input name="height" type="number" min="480" max="2160" value="720" /></label>
                        <label>DPR<input name="dpr" type="number" min="0.5" max="3" step="any" value="1" /></label>
                        <label><input name="gpu_timing" type="checkbox" /> Diagnóstico de tiempo GPU</label>
                    </fieldset>
                    <div class="buttons"><button id="start" type="submit">Iniciar</button><button id="stop" type="button" disabled>Detener</button></div>
                </form>
                <div class="buttons"><button id="json" disabled>Exportar JSON</button><button id="csv" disabled>Exportar CSV</button></div>
                <label>Comparar con JSON anterior<input id="baseline" type="file" accept="application/json,.json" /></label>
                <p>Tres imágenes y tres fuentes fijas. El canvas puede mostrarse a escala; su resolución medida figura en los resultados.</p>
                <p>En esta página manual, CDP y RSS no están disponibles. Usa el comando de consola con --headed para medirlos con ventana.</p>
            </aside>
            <section>
                <canvas id="benchmark" width="1280" height="720"></canvas>
                <div id="output"><pre id="status" role="status">Listo.</pre><pre id="comparison" role="status" hidden></pre><pre id="results">Los resultados aparecerán aquí.</pre></div>
            </section>
        </main>
        <script type="module" src="./page.ts"></script>
    </body>
</html>
