<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <script type="module" src="./layout-runner.ts"></script>
        <style>
            @font-face {
                font-family: 'Poppins-Regular';
                src: url('/examples/assets/fonts/Poppins-Regular.ttf') format('truetype');
            }

            @font-face {
                font-family: 'ChangaOne-Regular';
                src: url('/examples/assets/fonts/ChangaOne-Regular.ttf') format('truetype');
            }

            html,
            body {
                margin: 0;
                width: 100%;
                height: 100%;
                overflow: hidden;
            }

            #root {
                position: fixed;
                inset: 0;
                width: 100vw;
                height: 100vh;
                overflow: hidden;
            }

            #RendererDom::-webkit-scrollbar,
            #RendererDom *::-webkit-scrollbar {
                width: 0;
                height: 0;
            }
        </style>
    </head>
    <body>
        <div id="root"></div>
    </body>
</html>
