<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Octane components</title>
        <script>
            if (new URLSearchParams(location.search).has('example') === false) {
                location.replace('?example=input')
            }
        </script>
        <style>
            @font-face {
                font-family: 'Poppins-Regular';
                src: url('/assets/fonts/Poppins-Regular.ttf') format('truetype');
                font-weight: normal;
                font-style: normal;
            }
            @font-face {
                font-family: 'ChangaOne-Regular';
                src: url('/assets/fonts/ChangaOne-Regular.ttf') format('truetype');
                font-weight: normal;
                font-style: normal;
            }
            @font-face {
                font-family: 'Nougat-ExtraBlack';
                src: url('/assets/fonts/Nougat-ExtraBlack.ttf') format('truetype');
                font-weight: normal;
                font-style: normal;
            }

            html,
            body {
                margin: 0;
                width: 100%;
                height: 100%;
                overflow: hidden;
                overscroll-behavior: none;
                font-family: 'Poppins-Regular', 'ChangaOne-Regular', system-ui, sans-serif;
            }

            #root {
                position: fixed;
                inset: 0;
                overflow: hidden;
            }
            #root > * {
                display: flex;
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                height: 100%;
            }

            canvas {
                touch-action: none;
            }
        </style>
    </head>
    <body>
        <div id="root"></div>
        <div id="settings-panel">
            <div class="settings-panel-title">Renderers</div>
            <div id="settings-renderers"></div>
        </div>
        <script type="module">
            import ResourcesDom from 'uno-ui/ResourcesDom'
            import ResourcesWebGPU from 'uno-ui/ResourcesWebGPU'
            import UIDom from 'uno-ui/UIDom'
            import UIWebGPU from 'uno-ui/UIWebGPU'
            import { loadYoga } from 'yoga-layout/load'
            import { initSettingsPanel } from '../settings/settings-panel'

            const EXAMPLES = {
                input: () => import('./input'),
                image: () => import('./image'),
                scrollview: () => import('./scrollview'),
            }
            const RENDERERS = {
                RendererDom: { element_type: 'div', ui_class: UIDom, resources_class: ResourcesDom },
                RendererWebGPU: { element_type: 'canvas', ui_class: UIWebGPU, resources_class: ResourcesWebGPU },
            }
            const POINTER_EVENTS = ['pointerdown', 'pointerup', 'pointermove', 'pointercancel', 'wheel']

            const root = document.getElementById('root')
            const example_name = new URLSearchParams(location.search).get('example')
            const { default: create_example } = await EXAMPLES[example_name]()
            const device_pixel_ratio = window.devicePixelRatio
            const uis = []

            initSettingsPanel({ root })

            for (const [renderer_name, setup] of Object.entries(RENDERERS)) {
                const is_canvas = setup.element_type === 'canvas'
                const element = document.createElement(setup.element_type)
                element.id = renderer_name
                root.appendChild(element)

                const resources = await setup.resources_class.create({ canvas: element })
                const { ui } = await setup.ui_class.create({ resources, loadYoga, device_pixel_ratio })

                function syncRendererSize() {
                    const width = root.clientWidth
                    const height = root.clientHeight

                    if (is_canvas) {
                        element.width = Math.max(1, Math.round(width * device_pixel_ratio))
                        element.height = Math.max(1, Math.round(height * device_pixel_ratio))
                    }

                    ui.setViewport(width, height)
                    ui.setDevicePixelRatio(device_pixel_ratio)
                    ui.update()
                }

                syncRendererSize()
                window.addEventListener('resize', syncRendererSize)

                // UIDom listens on its own element, UIWebGPU needs the canvas events forwarded.
                if (is_canvas) {
                    POINTER_EVENTS.forEach((type) => {
                        element.addEventListener(type, (event) => ui.dispatchEvent(event))
                    })
                }

                await create_example({ ui, resources })
                uis.push(ui)
            }

            requestAnimationFrame(function render() {
                uis.forEach((ui) => ui.draw())
                requestAnimationFrame(render)
            })
        </script>
    </body>
</html>
