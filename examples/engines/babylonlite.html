<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <style>
            html,
            body {
                margin: 0;
                width: 100%;
                height: 100%;
                overflow: hidden;
            }

            canvas {
                display: block;
                width: 100%;
                height: 100%;
                touch-action: none;
            }
        </style>
    </head>
    <body>
        <canvas></canvas>
        <script type="module">
            import UI from '../../src/ui/UI'
            import ResourcesWebGPU from '../../src/renderer/webgpu/ResourcesWebGPU'
            import { loadImage, loadJson } from '../shared/load-assets'
            import { main } from './babylonlite.ts'

            const canvas = document.querySelector('canvas')
            const onCanvasEvent = window.addEventListener
            const requestAnimationFrame = window.requestAnimationFrame.bind(window)
            main({
                canvas,
                onCanvasEvent,
                requestAnimationFrame,
                UI,
                ResourcesWebGPU,
                loadImage,
                loadJson,
            }).catch(console.error)
        </script>
    </body>
</html>
