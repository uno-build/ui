<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>TypeGPU World Space</title>
        <style>
            html,
            body,
            canvas {
                width: 100%;
                height: 100%;
                margin: 0;
            }

            canvas {
                display: block;
                touch-action: none;
            }
        </style>
    </head>
    <body>
        <canvas></canvas>
        <script type="module">
            import * as web from '@typegpu/kit/web'
            import ResourcesWebGPU from '../../src/renderer/webgpu/ResourcesWebGPU'
            import UI from '../../src/ui/UIWebGPU'
            import UITypeGPU from '../../src/ui/UIWebGPUTypeGPU'
            import { loadYoga } from 'yoga-layout/load'
            import { loadAssets } from '../shared/assets'
            import { loadImage, loadJson } from '../shared/load-assets'
            import { createScene } from './typegpu-worldspace.ts'

            const canvas = document.querySelector('canvas')
            const hosted = web.host(
                createScene,
                {
                    ResourcesWebGPU,
                    UI,
                    UITypeGPU,
                    loadYoga,
                    loadAssets: () => loadAssets({ loadImage, loadJson }),
                    onCanvasEvent(type, handleEvent) {
                        canvas.addEventListener(type, handleEvent, { passive: false })
                        return () => canvas.removeEventListener(type, handleEvent)
                    },
                },
                {
                    canvas,
                    attach: ({ scene }) => {
                        for (const ui of scene.uis) ui.registerPlatformEvents()
                    },
                },
            )
            window.addEventListener('pagehide', () => hosted.destroy(), { once: true })
            import.meta.hot?.dispose(() => hosted.destroy())
        </script>
    </body>
</html>
