<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>TypeGPU World Space</title>
        <style>
            html,
            body,
            canvas {
                width: 100%;
                height: 100%;
                margin: 0;
            }

            canvas {
                display: block;
                touch-action: none;
            }
        </style>
    </head>
    <body>
        <canvas></canvas>
        <script type="module">
            import ResourcesWebGPU from '../../src/renderer/webgpu/ResourcesWebGPU'
            import UI from '../../src/ui/UIWebGPU'
            import UITypeGPU from '../../src/ui/UIWebGPUTypeGPU'
            import { loadYoga } from 'yoga-layout/load'
            import { loadAssets } from '../shared/assets'
            import { loadImage, loadJson } from '../shared/load-assets'
            import { main } from './typegpu-worldspace.ts'

            const canvas = document.querySelector('canvas')
            const scene = await main({
                canvas,
                ResourcesWebGPU,
                UI,
                UITypeGPU,
                loadYoga,
                loadAssets: () => loadAssets({ loadImage, loadJson }),
                onCanvasEvent(type, handleEvent) {
                    const target = type === 'resize' ? window : canvas
                    target.addEventListener(type, handleEvent, { passive: false })
                    return () => target.removeEventListener(type, handleEvent)
                },
            })
            for (const ui of scene.uis) ui.registerPlatformEvents()
            window.addEventListener('pagehide', (event) => {
                if (!event.persisted) scene.destroy()
            })
            import.meta.hot?.dispose(() => scene.destroy())
        </script>
    </body>
</html>
