<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <style>
            html,
            body {
                margin: 0;
                width: 100%;
                height: 100%;
                overflow: hidden;
            }

            canvas {
                display: block;
                width: 100%;
                height: 100%;
                touch-action: none;
            }
        </style>
    </head>
    <body>
        <canvas></canvas>
        <script type="module">
            import * as web from '@typegpu/kit/web'
            import UI from '../../src/ui/UIWebGPU'
            import ResourcesWebGPU from '../../src/renderer/webgpu/ResourcesWebGPU'
            import { loadImage, loadJson } from '../shared/load-assets'
            import { loadAssets } from '../shared/assets'
            import { loadYoga } from 'yoga-layout/load'
            import { createScene } from './typegpu.ts'

            const hosted = web.host(
                createScene,
                {
                    UI,
                    ResourcesWebGPU,
                    loadYoga,
                    loadAssets: () => loadAssets({ loadImage, loadJson }),
                },
                {
                    canvas: document.querySelector('canvas'),
                    attach: ({ scene }) => {
                        for (const ui of scene.uis) ui.registerPlatformEvents()
                    },
                },
            )
            window.addEventListener('pagehide', () => hosted.destroy(), { once: true })
            import.meta.hot?.dispose(() => hosted.destroy())
        </script>
    </body>
</html>
