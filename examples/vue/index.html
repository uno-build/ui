<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Vue components</title>
        <style>
            @font-face {
                font-family: 'Poppins-Regular';
                src: url('/assets/fonts/Poppins-Regular.ttf') format('truetype');
                font-weight: normal;
                font-style: normal;
            }

            html,
            body {
                margin: 0;
                width: 100%;
                height: 100%;
                overflow: hidden;
                overscroll-behavior: none;
                font-family: 'Poppins-Regular', system-ui, sans-serif;
            }

            #root {
                position: fixed;
                inset: 0;
                overflow: hidden;
            }
            #root > * {
                display: flex;
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                height: 100%;
            }

            canvas {
                touch-action: none;
            }
        </style>
    </head>
    <body>
        <div id="root"></div>
        <div id="settings-panel">
            <div class="settings-panel-title">Renderers</div>
            <div id="settings-renderers"></div>
        </div>
        <script type="module" src="./main.ts"></script>
    </body>
</html>
