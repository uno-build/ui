<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Vue components</title>
        <script>
            if (new URLSearchParams(location.search).has('example') === false) {
                location.replace('?example=scrollview')
            }
        </script>
        <script type="module">
            import {
                FONT_NAME_POPPINS,
                FONT_NAME_CHANGA,
                FONT_NAME_NOUGAT,
                registerDomFonts,
            } from '../shared/assets.ts'
            registerDomFonts([FONT_NAME_POPPINS, FONT_NAME_CHANGA, FONT_NAME_NOUGAT])
        </script>
        <style>
            html,
            body {
                margin: 0;
                width: 100%;
                height: 100%;
                overflow: hidden;
                overscroll-behavior: none;
                font-family: 'Poppins-Regular', system-ui, sans-serif;
                background-color: #f2f7f4;
                color: #0a1f16;
            }

            #root {
                position: fixed;
                inset: 0;
                overflow: hidden;
            }
            #root > * {
                display: flex;
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                height: 100%;
            }

            canvas {
                touch-action: none;
            }

            body #settings-panel {
                background: #ffffff;
                color: #0a1f16;
            }
            #settings-panel .settings-renderer-opacity {
                color: #658273;
            }
            #settings-panel input {
                accent-color: #1f8a5b;
            }

            .settings-examples-title {
                margin-top: 8px;
                padding-top: 8px;
                border-top: 1px solid #a8cdb8;
            }
            .settings-example {
                display: block;
                padding: 2px 0;
                color: inherit;
                text-decoration: none;
            }
            .settings-example:hover {
                text-decoration: underline;
            }
            .settings-example[aria-current='page'] {
                color: #1f8a5b;
            }
        </style>
    </head>
    <body>
        <div id="root"></div>
        <div id="settings-panel">
            <div class="settings-panel-title">Renderers</div>
            <div id="settings-renderers"></div>
            <div class="settings-panel-title settings-examples-title">Examples</div>
            <div id="settings-examples"></div>
        </div>
        <script type="module" src="./main.ts"></script>
    </body>
</html>
