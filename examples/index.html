        <style>
            * {
                user-select: none;
                touch-action: none;
                box-sizing: border-box;
            }
            html,
            body {
                margin: 0;
                width: 100%;
                height: 100%;
                overflow: hidden;
                overscroll-behavior: none;
            }
            body {
                position: fixed;
                inset: 0;
            }
            #root {
                position: fixed;
                inset: 0;
                width: 100vw;
                height: 100dvh;
                overflow: hidden;
            }
            canvas {
                display: block;
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                height: 100%;
            }
        </style>
        <script type="module" src="./main.ts"></script>
    </head>
