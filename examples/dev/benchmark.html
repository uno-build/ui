<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <style>
            html,
            body {
                margin: 0;
                width: 100%;
                height: 100%;
                overflow: hidden;
            }

            #root {
                position: fixed;
                inset: 0;
                width: 100vw;
                height: 100vh;
                overflow: hidden;
            }

            #results {
                position: fixed;
                left: 16px;
                top: 16px;
                z-index: 1;
                margin: 0;
                padding: 12px;
                max-width: calc(100vw - 32px);
                overflow: auto;
                background: #ffffffd9;
                color: #111827;
                font:
                    12px/1.4 ui-monospace,
                    SFMono-Regular,
                    Menlo,
                    Monaco,
                    Consolas,
                    monospace;
            }
        </style>
    </head>
    <body>
        <div id="root"></div>
        <pre id="results">Running...</pre>
        <script type="module">
            import UI from '../../src/UI'
            import RendererWebGPU from '../../src/renderer/RendererWebGPU'
            import { WebGPUSharedContext } from '../../src/renderer/webgpu/WebGPUSharedContext'
            import { loadImage, loadJson } from '../../src/utils/load-assets'
            import { loadYoga } from 'yoga-layout/load'

            const DEFAULT_NODES = 400
            const DEFAULT_FRAMES = 60
            const DEFAULT_WARMUP = 10
            const CARD_WIDTH = 58
            const CARD_HEIGHT = 38
            const GAP = 18

            const SCENES = [
                {
                    name: 'unset',
                    box_shadow: 'unset',
                    text_shadow: 'unset',
                    text_stroke: 'unset',
                },
                {
                    name: 'small',
                    box_shadow: '0px 2px 6px 0px #00000040',
                    text_stroke: '2px #172554',
                    text_shadow: '2px 2px 2px #00000040',
                },
                {
                    name: 'large',
                    box_shadow: '0px 8px 22px 0px #00000040',
                    text_stroke: '4px #172554',
                    text_shadow: '4px 4px 4px #00000040',
                },
                {
                    name: 'mixed',
                    box_shadow: null,
                    text_shadow: null,
                    text_stroke: null,
                },
            ]

            async function runWebGPUBoxShadowBenchmark({ root, params }) {
                const nodes = readNumber(params, 'nodes', DEFAULT_NODES)
                const frames = readNumber(params, 'frames', DEFAULT_FRAMES)
                const warmup = readNumber(params, 'warmup', DEFAULT_WARMUP)
                const [font_image, font_json] = await Promise.all([
                    loadImage('/assets/fonts/ChangaOne-Regular.mtsdf.png'),
                    loadJson('/assets/fonts/ChangaOne-Regular.mtsdf.json'),
                ])
                const scenes = []

                for (const scene of SCENES) {
                    scenes.push(
                        await runScene({
                            root,
                            scene,
                            nodes,
                            frames,
                            warmup,
                            font_image,
                            font_json,
                        }),
                    )
                }

                return {
                    nodes,
                    frames,
                    warmup,
                    scenes,
                }
            }

            async function runScene({ root, scene, nodes, frames, warmup, font_image, font_json }) {
                root.textContent = ''

                const canvas = document.createElement('canvas')
                canvas.style.display = 'block'
                canvas.style.width = '100%'
                canvas.style.height = '100%'
                root.appendChild(canvas)

                const webgpu = new WebGPUSharedContext({ canvas })
                await webgpu.init()
                const renderer = new RendererWebGPU({ webgpu, loadYoga })
                const ui = new UI({ renderer, device_pixel_ratio: window.devicePixelRatio })
                await ui.init()
                webgpu.registerFont('Poppins-Regular', font_image, font_json)

                ui.setViewport(root.clientWidth, root.clientHeight)
                canvas.width = Math.round(root.clientWidth * window.devicePixelRatio)
                canvas.height = Math.round(root.clientHeight * window.devicePixelRatio)
                ui.root.style('backgroundColor', '#f6f7f9')

                createGrid({ ui, scene, nodes, width: root.clientWidth })

                for (let i = 0; i < warmup; i++) {
                    ui.update()
                    ui.draw()
                    await renderer.device.queue.onSubmittedWorkDone()
                }

                const render_times = []
                const submitted_times = []

                for (let i = 0; i < frames; i++) {
                    const render_start = performance.now()
                    ui.update()
                    ui.draw()
                    const render_end = performance.now()
                    await renderer.device.queue.onSubmittedWorkDone()
                    const submitted_end = performance.now()

                    render_times.push(render_end - render_start)
                    submitted_times.push(submitted_end - render_start)
                }

                root.removeChild(canvas)

                return {
                    scene: scene.name,
                    renderAvgMs: round(average(render_times)),
                    renderP95Ms: round(percentile(render_times, 0.95)),
                    submittedAvgMs: round(average(submitted_times)),
                    submittedP95Ms: round(percentile(submitted_times, 0.95)),
                    submittedMinMs: round(Math.min(...submitted_times)),
                    submittedMaxMs: round(Math.max(...submitted_times)),
                }
            }

            function createGrid({ ui, scene, nodes, width }) {
                const columns = Math.max(1, Math.floor((width - GAP) / (CARD_WIDTH + GAP)))

                for (let i = 0; i < nodes; i++) {
                    const row = Math.floor(i / columns)
                    const column = i % columns
                    const node = ui.create()

                    node.style('position', 'absolute')
                    node.style('left', `${GAP + column * (CARD_WIDTH + GAP)}px`)
                    node.style('top', `${GAP + row * (CARD_HEIGHT + GAP)}px`)
                    node.style('width', `${CARD_WIDTH}px`)
                    node.style('height', `${CARD_HEIGHT}px`)
                    node.style('borderRadius', '6px')
                    node.style('backgroundColor', i % 2 === 0 ? '#ffffff' : '#eef2ff')
                    node.style('fontFamily', 'Poppins-Regular')
                    node.style('fontSize', `${8 + (i % 17)}px`)
                    node.style('color', '#ffffff')
                    node.text(`Text ${i}`)

                    const box_shadow = readBoxShadow(scene, i)
                    const text_shadow = readTextShadow(scene, i)
                    const text_stroke = readTextStroke(scene, i)

                    node.style('boxShadow', box_shadow)
                    node.style('textShadow', text_shadow)
                    node.style('textStroke', text_stroke)

                    ui.root.add(node)
                }
            }

            function readBoxShadow(scene, index) {
                if (scene.box_shadow != null) {
                    return scene.box_shadow
                }

                if (index % 3 === 0) {
                    return 'unset'
                }

                return index % 3 === 1 ? '0px 2px 6px 0px #00000040' : '0px 8px 22px 0px #00000040'
            }

            function readTextShadow(scene, index) {
                if (scene.text_shadow != null) {
                    return scene.text_shadow
                }

                if (index % 3 === 0) {
                    return 'unset'
                }

                return index % 3 === 1 ? '0px 2px 6px #00000040' : '0px 8px 22px #00000040'
            }

            function readTextStroke(scene, index) {
                if (scene.text_stroke != null) {
                    return scene.text_stroke
                }

                if (index % 3 === 0) {
                    return 'unset'
                }

                return index % 3 === 1 ? '1px #172554' : '4px #172554'
            }

            function readNumber(params, name, fallback) {
                const value = Number(params.get(name))

                if (Number.isFinite(value) === false || value <= 0) {
                    return fallback
                }

                return Math.round(value)
            }

            function average(values) {
                return values.reduce((sum, value) => sum + value, 0) / values.length
            }

            function percentile(values, ratio) {
                const sorted_values = [...values].sort((a, b) => a - b)
                const index = Math.min(sorted_values.length - 1, Math.floor(sorted_values.length * ratio))

                return sorted_values[index]
            }

            function round(value) {
                return Math.round(value * 1000) / 1000
            }

            const root = document.getElementById('root')
            const results = document.getElementById('results')

            window.__boxShadowBenchmark = runWebGPUBoxShadowBenchmark({
                root,
                params: new URLSearchParams(window.location.search),
            })
                .then((result) => {
                    window.__boxShadowBenchmarkResult = result
                    console.table(result.scenes)
                    results.textContent = formatResult(result)
                    return result
                })
                .catch((error) => {
                    window.__boxShadowBenchmarkError = {
                        message: error.message,
                        stack: error.stack,
                    }
                    results.textContent = error.stack
                    throw error
                })

            function formatResult(result) {
                const lines = [`nodes=${result.nodes} frames=${result.frames} warmup=${result.warmup}`]

                for (const scene of result.scenes) {
                    lines.push(
                        [
                            scene.scene.padEnd(6),
                            `render avg ${scene.renderAvgMs}ms`,
                            `render p95 ${scene.renderP95Ms}ms`,
                            `submitted avg ${scene.submittedAvgMs}ms`,
                            `submitted p95 ${scene.submittedP95Ms}ms`,
                        ].join(' | '),
                    )
                }

                return lines.join('\n')
            }
        </script>
    </body>
</html>
