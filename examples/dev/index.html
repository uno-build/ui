<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
        />
        <style>
            * {
                user-select: none;
                touch-action: none;
            }
            html,
            body {
                margin: 0;
                width: 100%;
                height: 100%;
                overflow: hidden;
                overscroll-behavior: none;
            }
            body {
                position: fixed;
                inset: 0;
            }
            #root {
                position: fixed;
                inset: 0;
                width: 100vw;
                height: 100dvh;
                overflow: hidden;
            }
            #root > * {
                display: flex;
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                height: 100%;
                z-index: 0;
            }
            #mouse-tooltip {
                position: fixed;
                left: 0;
                top: 0;
                z-index: 10;
                padding: 4px 6px;
                border-radius: 4px;
                background: rgba(0, 0, 0, 0.75);
                color: white;
                font:
                    12px/1.2 system-ui,
                    sans-serif;
                pointer-events: none;
                transform: translate(12px, 12px);
                white-space: nowrap;
            }
        </style>
        <script type="module" src="./main.ts"></script>
    </head>
    <body>
        <div id="root"></div>
        <div id="mouse-tooltip">x: 0, y: 0</div>
        <script>
            const tooltip = document.getElementById('mouse-tooltip')

            window.addEventListener('mousemove', (event) => {
                tooltip.textContent = `x: ${event.clientX}, y: ${event.clientY}`
                tooltip.style.left = `${event.clientX}px`
                tooltip.style.top = `${event.clientY}px`
            })
        </script>
    </body>
</html>
