<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
        />
        <style>
            * {
                user-select: none;
                touch-action: none;
            }
            html,
            body {
                margin: 0;
                width: 100%;
                height: 100%;
                overflow: hidden;
                overscroll-behavior: none;
            }
            body {
                position: fixed;
                inset: 0;
            }
            #root {
                position: fixed;
                inset: 0;
                width: 100vw;
                height: 100dvh;
                overflow: hidden;
            }
            /* #root > * {
                display: flex;
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                height: 100%;
                z-index: 0;
            } */
            #mouse-tooltip {
                position: fixed;
                left: 0;
                top: 0;
                z-index: 10;
                padding: 4px 6px;
                border-radius: 4px;
                background: rgba(0, 0, 0, 0.75);
                color: white;
                font:
                    12px/1.2 system-ui,
                    sans-serif;
                pointer-events: none;
                transform: translate(12px, 12px);
                white-space: nowrap;
            }
            #settings-panel {
                position: absolute;
                left: 16px;
                top: 16px;
                z-index: 999;
                min-width: 140px;
                min-height: 40px;
                padding: 8px 10px;
                border-radius: 5px;
                background: rgba(18, 18, 18, 0.88);
                box-shadow: 0 8px 24px rgba(0, 0, 0, 0.28);
                color: white;
                cursor: grab;
                font:
                    11px system-ui,
                    sans-serif;
            }
            #settings-panel.dragging {
                cursor: grabbing;
            }
            #settings-panel-title {
                margin-bottom: 8px;
                font-weight: 600;
            }
            #settings-buttons {
                display: flex;
                gap: 4px;
            }
            .settings-renderer {
                display: flex;
                align-items: center;
                gap: 8px;
                height: 20px;
                cursor: pointer;
            }
            .settings-renderer input {
                margin: 0;
            }
            #settings-panel button {
                display: block;
                margin-top: 8px;
                width: 100%;
                padding: 4px 0;
                border: none;
                border-radius: 4px;
                background: rgba(255, 255, 255, 0.1);
                color: white;
                font:
                    11px system-ui,
                    sans-serif;
                cursor: pointer;
            }
        </style>
        <script type="module" src="./main.ts"></script>
    </head>
    <body>
        <div id="root"></div>
        <div id="settings-panel">
            <!-- <div id="settings-panel-title">Renderers</div> -->
            <div id="settings-renderers"></div>
            <div id="settings-buttons">
                <button id="add-random-node-button">+</button>
                <button id="remove-random-node-button">-</button>
            </div>
        </div>
        <div id="mouse-tooltip">x: 0, y: 0</div>
        <script>
            const root = document.getElementById('root')
            const tooltip = document.getElementById('mouse-tooltip')
            const settingsPanel = document.getElementById('settings-panel')
            const settingsRenderers =
                document.getElementById('settings-renderers')
            const add_random_node_button = document.getElementById(
                'add-random-node-button',
            )
            const remove_random_node_button = document.getElementById(
                'remove-random-node-button',
            )
            const SETTINGS_PANEL_POSITION_STORAGE_KEY =
                'settings-panel-position'
            const SETTINGS_RENDERERS_STORAGE_KEY = 'settings-renderers'
            let settingsDragX = 0
            let settingsDragY = 0
            const saved_active_renderer_names = getSavedActiveRendererNames()

            function getSettingsPanelPosition(left, top) {
                return {
                    left: Math.min(
                        left,
                        window.innerWidth - settingsPanel.offsetWidth,
                    ),
                    top: Math.min(
                        top,
                        window.innerHeight - settingsPanel.offsetHeight,
                    ),
                }
            }

            const saved_settings_panel_position = localStorage.getItem(
                SETTINGS_PANEL_POSITION_STORAGE_KEY,
            )
            if (saved_settings_panel_position) {
                const settings_panel_position = JSON.parse(
                    saved_settings_panel_position,
                )
                const normalized_settings_panel_position =
                    getSettingsPanelPosition(
                        settings_panel_position.left,
                        settings_panel_position.top,
                    )
                settingsPanel.style.left = `${normalized_settings_panel_position.left}px`
                settingsPanel.style.top = `${normalized_settings_panel_position.top}px`
                localStorage.setItem(
                    SETTINGS_PANEL_POSITION_STORAGE_KEY,
                    JSON.stringify(normalized_settings_panel_position),
                )
            }

            function saveSettingsPanelPosition() {
                const settings_panel_position = getSettingsPanelPosition(
                    settingsPanel.offsetLeft,
                    settingsPanel.offsetTop,
                )
                localStorage.setItem(
                    SETTINGS_PANEL_POSITION_STORAGE_KEY,
                    JSON.stringify(settings_panel_position),
                )
            }

            function getSavedActiveRendererNames() {
                const saved_renderer_names = localStorage.getItem(
                    SETTINGS_RENDERERS_STORAGE_KEY,
                )

                if (saved_renderer_names != null) {
                    return saved_renderer_names === ''
                        ? []
                        : saved_renderer_names.split(',')
                }

                return null
            }

            function isRendererActive(rendererName) {
                return (
                    saved_active_renderer_names == null ||
                    saved_active_renderer_names.includes(rendererName)
                )
            }

            function saveRendererSettings() {
                const renderer_names = Array.from(
                    settingsRenderers.querySelectorAll('input:checked'),
                ).map((rendererToggle) =>
                    rendererToggle.id.replace('settings-', ''),
                )

                localStorage.setItem(
                    SETTINGS_RENDERERS_STORAGE_KEY,
                    renderer_names.join(','),
                )
            }

            window.addEventListener('mousemove', (event) => {
                tooltip.textContent = `x: ${event.clientX}, y: ${event.clientY}`
                tooltip.style.left = `${event.clientX}px`
                tooltip.style.top = `${event.clientY}px`
            })

            settingsPanel.addEventListener('pointerdown', (event) => {
                if (event.target.closest('.settings-renderer, button')) {
                    return
                }

                settingsDragX = event.clientX - settingsPanel.offsetLeft
                settingsDragY = event.clientY - settingsPanel.offsetTop
                settingsPanel.classList.add('dragging')
                settingsPanel.setPointerCapture(event.pointerId)
            })

            settingsPanel.addEventListener('pointermove', (event) => {
                if (!settingsPanel.hasPointerCapture(event.pointerId)) {
                    return
                }

                settingsPanel.style.left = `${event.clientX - settingsDragX}px`
                settingsPanel.style.top = `${event.clientY - settingsDragY}px`
            })

            settingsPanel.addEventListener('pointerup', (event) => {
                if (!settingsPanel.hasPointerCapture(event.pointerId)) {
                    return
                }

                settingsPanel.classList.remove('dragging')
                settingsPanel.releasePointerCapture(event.pointerId)
                saveSettingsPanelPosition()
            })

            function addRendererSettings() {
                Array.from(root.children).forEach((renderer) => {
                    if (
                        settingsRenderers.querySelector(
                            `#settings-${renderer.id}`,
                        )
                    ) {
                        return
                    }

                    const rendererDisplay = renderer.style.display
                    const rendererToggle = document.createElement('input')
                    rendererToggle.type = 'checkbox'
                    rendererToggle.id = `settings-${renderer.id}`
                    rendererToggle.checked = isRendererActive(renderer.id)
                    renderer.style.display = rendererToggle.checked
                        ? rendererDisplay
                        : 'none'

                    const rendererLabel = document.createElement('label')
                    rendererLabel.className = 'settings-renderer'
                    rendererLabel.htmlFor = rendererToggle.id
                    rendererLabel.append(rendererToggle, renderer.id)

                    rendererToggle.addEventListener('change', () => {
                        renderer.style.display = rendererToggle.checked
                            ? rendererDisplay
                            : 'none'
                        saveRendererSettings()
                    })

                    settingsRenderers.appendChild(rendererLabel)
                })
            }

            add_random_node_button.addEventListener('click', () => {
                window.addRandomNode()
            })

            remove_random_node_button.addEventListener('click', () => {
                window.removeRandomNode()
            })

            document.addEventListener('DOMContentLoaded', () => {
                addRendererSettings()
                new MutationObserver(addRendererSettings).observe(root, {
                    childList: true,
                })
            })
        </script>
    </body>
</html>
