<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <style>
            html,
            body {
                margin: 0;
                width: 100%;
                height: 100%;
                overflow: hidden;
            }

            #root {
                position: fixed;
                inset: 0;
                width: 100vw;
                height: 100vh;
                overflow: hidden;
            }

            #results {
                position: fixed;
                left: 16px;
                top: 16px;
                z-index: 1;
                margin: 0;
                padding: 12px;
                max-width: calc(100vw - 32px);
                overflow: auto;
                background: #ffffffd9;
                color: #111827;
                font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            }
        </style>
    </head>
    <body>
        <div id="root"></div>
        <pre id="results">Running...</pre>
        <script type="module">
            import { runWebGPUBoxShadowBenchmark } from './webgpuBoxShadowBenchmark.ts'

            const root = document.getElementById('root')
            const results = document.getElementById('results')

            window.__boxShadowBenchmark = runWebGPUBoxShadowBenchmark({
                root,
                params: new URLSearchParams(window.location.search),
            })
                .then((result) => {
                    window.__boxShadowBenchmarkResult = result
                    console.table(result.scenes)
                    results.textContent = formatResult(result)
                    return result
                })
                .catch((error) => {
                    window.__boxShadowBenchmarkError = {
                        message: error.message,
                        stack: error.stack,
                    }
                    results.textContent = error.stack
                    throw error
                })

            function formatResult(result) {
                const lines = [`nodes=${result.nodes} frames=${result.frames} warmup=${result.warmup}`]

                for (const scene of result.scenes) {
                    lines.push(
                        [
                            scene.scene.padEnd(6),
                            `render avg ${scene.renderAvgMs}ms`,
                            `render p95 ${scene.renderP95Ms}ms`,
                            `submitted avg ${scene.submittedAvgMs}ms`,
                            `submitted p95 ${scene.submittedP95Ms}ms`,
                        ].join(' | '),
                    )
                }

                return lines.join('\n')
            }
        </script>
    </body>
</html>
