<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Shelf Allocator</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, sans-serif;
        background: #f4f4f0;
        color: #1d2525;
      }

      main {
        display: grid;
        gap: 12px;
        justify-items: start;
      }

      .toolbar {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      button,
      select {
        border: 1px solid #1d2525;
        border-radius: 6px;
        padding: 8px 14px;
        font: inherit;
        background: #ffffff;
      }

      button {
        cursor: pointer;
      }

      button:hover {
        background: #e9f1ef;
      }

      #status {
        font-size: 14px;
      }

      #atlas {
        position: relative;
        width: 1024px;
        height: 1024px;
        border: 1px solid #1d2525;
        background:
          linear-gradient(#d8ddda 1px, transparent 1px),
          linear-gradient(90deg, #d8ddda 1px, transparent 1px),
          #ffffff;
        background-size: 64px 64px;
        overflow: hidden;
      }

      .rect {
        position: absolute;
        border: 1px solid rgba(0, 0, 0, 0.45);
        display: grid;
        place-items: center;
        font-size: 12px;
        color: rgba(0, 0, 0, 0.7);
        cursor: pointer;
        user-select: none;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="toolbar">
        <select id="algorithm" aria-label="Algoritmo">
          <option value="shelf">Shelf</option>
          <option value="shelf-best-fit">Shelf Best Fit</option>
          <option value="skyline">Skyline</option>
          <option value="skyline-best-fit">Skyline Best Fit</option>
          <option value="guillotine">Guillotine</option>
          <option value="max-rects">MaxRects</option>
          <option value="binary-tree">Binary Tree</option>
          <option value="grid">Grid / Cell</option>
          <option value="buddy">Buddy</option>
        </select>
        <button id="add">Add</button>
        <button data-size-range="8,128">8-128px</button>
        <button data-size-range="48,128">48-128px</button>
        <button data-size-range="128,256">128-256px</button>
        <button data-size-range="256,512">256-512px</button>
        <button id="fill">Fill</button>
        <span id="status">0 rectángulos; 0% ocupado</span>
      </div>
      <div id="atlas" aria-label="Atlas 1024 por 1024"></div>
    </main>

    <script>
      const ATLAS_SIZE = 1024;
      const MIN_RECT_SIZE = 32;
      const MAX_RECT_SIZE = 180;
      const GRID_CELL_SIZE = 32;
      const GRID_SIZE = ATLAS_SIZE / GRID_CELL_SIZE;

      const atlas = document.querySelector("#atlas");
      const algorithm_select = document.querySelector("#algorithm");
      const add_button = document.querySelector("#add");
      const fill_button = document.querySelector("#fill");
      const size_range_buttons = document.querySelectorAll("[data-size-range]");
      const status = document.querySelector("#status");

      let current_x = 0;
      let current_y = 0;
      let shelf_height = 0;
      let shelves = [];
      let shelves_y = 0;
      let skyline = [{ x: 0, y: 0, width: ATLAS_SIZE }];
      let free_rects = [{ x: 0, y: 0, width: ATLAS_SIZE, height: ATLAS_SIZE }];
      let max_rects = [{ x: 0, y: 0, width: ATLAS_SIZE, height: ATLAS_SIZE }];
      let binary_tree = { x: 0, y: 0, width: ATLAS_SIZE, height: ATLAS_SIZE };
      let grid_cells = createGridCells();
      let buddy_tree = { x: 0, y: 0, size: ATLAS_SIZE };
      let free_holes = [];
      let placed_rects = [];
      let rect_count = 0;
      let occupied_area = 0;

      function randomSize(min_size = MIN_RECT_SIZE, max_size = MAX_RECT_SIZE) {
        return Math.floor(Math.random() * (max_size - min_size + 1)) + min_size;
      }

      function randomColor() {
        const hue = Math.floor(Math.random() * 360);
        return `hsl(${hue} 70% 78%)`;
      }

      function occupiedLabel() {
        const occupied_percent = Math.round(occupied_area / (ATLAS_SIZE * ATLAS_SIZE) * 100);

        return `${occupied_percent}% ocupado`;
      }

      function createGridCells() {
        return Array(GRID_SIZE * GRID_SIZE).fill(false);
      }

      function addFreeHole(hole) {
        if (hole.width > 0 && hole.height > 0) {
          free_holes.push(hole);
        }
      }

      function splitFreeHole(hole, width, height) {
        const remaining_width = hole.width - width;
        const remaining_height = hole.height - height;

        if (remaining_width > remaining_height) {
          addFreeHole({
            x: hole.x + width,
            y: hole.y,
            width: remaining_width,
            height: hole.height,
          });
          addFreeHole({
            x: hole.x,
            y: hole.y + height,
            width,
            height: remaining_height,
          });
          return;
        }

        addFreeHole({
          x: hole.x,
          y: hole.y + height,
          width: hole.width,
          height: remaining_height,
        });
        addFreeHole({
          x: hole.x + width,
          y: hole.y,
          width: remaining_width,
          height,
        });
      }

      function allocateFreeHole(width, height) {
        let best_index = -1;
        let best_score = ATLAS_SIZE * ATLAS_SIZE + 1;

        for (let index = 0; index < free_holes.length; index += 1) {
          const hole = free_holes[index];

          if (width <= hole.width && height <= hole.height) {
            const score = hole.width * hole.height - width * height;

            if (score < best_score) {
              best_index = index;
              best_score = score;
            }
          }
        }

        if (best_index === -1) {
          return null;
        }

        const hole = free_holes.splice(best_index, 1)[0];
        const placement = {
          x: hole.x,
          y: hole.y,
          width,
          height,
        };

        splitFreeHole(hole, width, height);

        return placement;
      }

      function allocateShelf(width, height) {
        if (current_x + width > ATLAS_SIZE) {
          current_x = 0;
          current_y += shelf_height;
          shelf_height = 0;
        }

        if (current_y + height > ATLAS_SIZE) {
          return null;
        }

        const placement = {
          x: current_x,
          y: current_y,
          width,
          height,
        };

        current_x += width;
        shelf_height = Math.max(shelf_height, height);

        return placement;
      }

      function allocateShelfBestFit(width, height) {
        let best_shelf = null;
        let best_height_left = ATLAS_SIZE + 1;
        let best_width_left = ATLAS_SIZE + 1;

        for (const shelf of shelves) {
          if (height <= shelf.height && shelf.x + width <= ATLAS_SIZE) {
            const height_left = shelf.height - height;
            const width_left = ATLAS_SIZE - shelf.x - width;

            if (height_left < best_height_left || (height_left === best_height_left && width_left < best_width_left)) {
              best_shelf = shelf;
              best_height_left = height_left;
              best_width_left = width_left;
            }
          }
        }

        if (!best_shelf) {
          if (shelves_y + height > ATLAS_SIZE) {
            return null;
          }

          best_shelf = {
            x: 0,
            y: shelves_y,
            height,
          };
          shelves.push(best_shelf);
          shelves_y += height;
        }

        const placement = {
          x: best_shelf.x,
          y: best_shelf.y,
          width,
          height,
        };

        best_shelf.x += width;

        return placement;
      }

      function getSkylineY(index, width, height) {
        const x = skyline[index].x;
        let y = skyline[index].y;
        let width_left = width;

        if (x + width > ATLAS_SIZE) {
          return null;
        }

        while (width_left > 0) {
          const node = skyline[index];
          y = Math.max(y, node.y);

          if (y + height > ATLAS_SIZE) {
            return null;
          }

          width_left -= node.width;
          index += 1;
        }

        return y;
      }

      function mergeSkyline() {
        for (let index = 0; index < skyline.length - 1; index += 1) {
          const node = skyline[index];
          const next_node = skyline[index + 1];

          if (node.y === next_node.y) {
            node.width += next_node.width;
            skyline.splice(index + 1, 1);
            index -= 1;
          }
        }
      }

      function addSkylineNode(index, placement) {
        skyline.splice(index, 0, {
          x: placement.x,
          y: placement.y + placement.height,
          width: placement.width,
        });

        for (let node_index = index + 1; node_index < skyline.length; node_index += 1) {
          const previous_node = skyline[node_index - 1];
          const node = skyline[node_index];
          const overlap = previous_node.x + previous_node.width - node.x;

          if (overlap <= 0) {
            break;
          }

          node.x += overlap;
          node.width -= overlap;

          if (node.width <= 0) {
            skyline.splice(node_index, 1);
            node_index -= 1;
          }
        }

        mergeSkyline();
      }

      function allocateSkyline(width, height) {
        let best_index = -1;
        let best_x = 0;
        let best_y = ATLAS_SIZE + 1;

        for (let index = 0; index < skyline.length; index += 1) {
          const y = getSkylineY(index, width, height);

          if (y !== null && (y < best_y || (y === best_y && skyline[index].x < best_x))) {
            best_index = index;
            best_x = skyline[index].x;
            best_y = y;
          }
        }

        if (best_index === -1) {
          return null;
        }

        const placement = {
          x: best_x,
          y: best_y,
          width,
          height,
        };

        addSkylineNode(best_index, placement);

        return placement;
      }

      function getSkylineWaste(index, width, y) {
        let waste = 0;
        let width_left = width;

        while (width_left > 0) {
          const node = skyline[index];
          const overlap_width = Math.min(width_left, node.width);

          waste += (y - node.y) * overlap_width;
          width_left -= overlap_width;
          index += 1;
        }

        return waste;
      }

      function allocateSkylineBestFit(width, height) {
        let best_index = -1;
        let best_x = 0;
        let best_y = ATLAS_SIZE + 1;
        let best_waste = ATLAS_SIZE * ATLAS_SIZE + 1;

        for (let index = 0; index < skyline.length; index += 1) {
          const y = getSkylineY(index, width, height);

          if (y !== null) {
            const waste = getSkylineWaste(index, width, y);

            if (waste < best_waste || (waste === best_waste && (y < best_y || (y === best_y && skyline[index].x < best_x)))) {
              best_index = index;
              best_x = skyline[index].x;
              best_y = y;
              best_waste = waste;
            }
          }
        }

        if (best_index === -1) {
          return null;
        }

        const placement = {
          x: best_x,
          y: best_y,
          width,
          height,
        };

        addSkylineNode(best_index, placement);

        return placement;
      }

      function addFreeRect(rect) {
        if (rect.width > 0 && rect.height > 0) {
          free_rects.push(rect);
        }
      }

      function splitFreeRect(free_rect, width, height) {
        const remaining_width = free_rect.width - width;
        const remaining_height = free_rect.height - height;

        if (remaining_width > remaining_height) {
          addFreeRect({
            x: free_rect.x + width,
            y: free_rect.y,
            width: remaining_width,
            height: free_rect.height,
          });
          addFreeRect({
            x: free_rect.x,
            y: free_rect.y + height,
            width,
            height: remaining_height,
          });
          return;
        }

        addFreeRect({
          x: free_rect.x,
          y: free_rect.y + height,
          width: free_rect.width,
          height: remaining_height,
        });
        addFreeRect({
          x: free_rect.x + width,
          y: free_rect.y,
          width: remaining_width,
          height,
        });
      }

      function allocateGuillotine(width, height) {
        let best_index = -1;
        let best_score = ATLAS_SIZE * ATLAS_SIZE + 1;

        for (let index = 0; index < free_rects.length; index += 1) {
          const free_rect = free_rects[index];

          if (width <= free_rect.width && height <= free_rect.height) {
            const score = free_rect.width * free_rect.height - width * height;

            if (score < best_score) {
              best_index = index;
              best_score = score;
            }
          }
        }

        if (best_index === -1) {
          return null;
        }

        const free_rect = free_rects.splice(best_index, 1)[0];
        const placement = {
          x: free_rect.x,
          y: free_rect.y,
          width,
          height,
        };

        splitFreeRect(free_rect, width, height);

        return placement;
      }

      function containsRect(rect, other_rect) {
        return other_rect.x >= rect.x
          && other_rect.y >= rect.y
          && other_rect.x + other_rect.width <= rect.x + rect.width
          && other_rect.y + other_rect.height <= rect.y + rect.height;
      }

      function addMaxRect(rect) {
        if (rect.width > 0 && rect.height > 0) {
          max_rects.push(rect);
        }
      }

      function splitMaxRect(free_rect, placement) {
        if (placement.x > free_rect.x) {
          addMaxRect({
            x: free_rect.x,
            y: free_rect.y,
            width: placement.x - free_rect.x,
            height: free_rect.height,
          });
        }

        if (placement.x + placement.width < free_rect.x + free_rect.width) {
          addMaxRect({
            x: placement.x + placement.width,
            y: free_rect.y,
            width: free_rect.x + free_rect.width - placement.x - placement.width,
            height: free_rect.height,
          });
        }

        if (placement.y > free_rect.y) {
          addMaxRect({
            x: free_rect.x,
            y: free_rect.y,
            width: free_rect.width,
            height: placement.y - free_rect.y,
          });
        }

        if (placement.y + placement.height < free_rect.y + free_rect.height) {
          addMaxRect({
            x: free_rect.x,
            y: placement.y + placement.height,
            width: free_rect.width,
            height: free_rect.y + free_rect.height - placement.y - placement.height,
          });
        }
      }

      function pruneMaxRects() {
        for (let index = 0; index < max_rects.length; index += 1) {
          for (let next_index = index + 1; next_index < max_rects.length; next_index += 1) {
            const rect = max_rects[index];
            const next_rect = max_rects[next_index];

            if (containsRect(rect, next_rect)) {
              max_rects.splice(next_index, 1);
              next_index -= 1;
            } else if (containsRect(next_rect, rect)) {
              max_rects.splice(index, 1);
              index -= 1;
              break;
            }
          }
        }
      }

      function placeMaxRect(placement) {
        for (let index = 0; index < max_rects.length; index += 1) {
          const free_rect = max_rects[index];
          const intersects = placement.x < free_rect.x + free_rect.width
            && placement.x + placement.width > free_rect.x
            && placement.y < free_rect.y + free_rect.height
            && placement.y + placement.height > free_rect.y;

          if (!intersects) {
            continue;
          }

          max_rects.splice(index, 1);
          splitMaxRect(free_rect, placement);
          index -= 1;
        }

        pruneMaxRects();
      }

      function allocateMaxRects(width, height) {
        let best_index = -1;
        let best_score = ATLAS_SIZE * ATLAS_SIZE + 1;
        let best_short_side = ATLAS_SIZE + 1;

        for (let index = 0; index < max_rects.length; index += 1) {
          const free_rect = max_rects[index];

          if (width <= free_rect.width && height <= free_rect.height) {
            const leftover_width = free_rect.width - width;
            const leftover_height = free_rect.height - height;
            const score = free_rect.width * free_rect.height - width * height;
            const short_side = Math.min(leftover_width, leftover_height);

            if (score < best_score || (score === best_score && short_side < best_short_side)) {
              best_index = index;
              best_score = score;
              best_short_side = short_side;
            }
          }
        }

        if (best_index === -1) {
          return null;
        }

        const free_rect = max_rects[best_index];
        const placement = {
          x: free_rect.x,
          y: free_rect.y,
          width,
          height,
        };

        placeMaxRect(placement);

        return placement;
      }

      function findBinaryTreeNode(node, width, height) {
        if (node.used) {
          return findBinaryTreeNode(node.right, width, height) || findBinaryTreeNode(node.down, width, height);
        }

        if (width <= node.width && height <= node.height) {
          return node;
        }

        return null;
      }

      function splitBinaryTreeNode(node, width, height) {
        const remaining_width = node.width - width;
        const remaining_height = node.height - height;

        node.used = true;

        if (remaining_width > remaining_height) {
          node.right = {
            x: node.x + width,
            y: node.y,
            width: remaining_width,
            height: node.height,
          };
          node.down = {
            x: node.x,
            y: node.y + height,
            width,
            height: remaining_height,
          };
        } else {
          node.right = {
            x: node.x + width,
            y: node.y,
            width: remaining_width,
            height,
          };
          node.down = {
            x: node.x,
            y: node.y + height,
            width: node.width,
            height: remaining_height,
          };
        }

        return {
          x: node.x,
          y: node.y,
          width,
          height,
        };
      }

      function allocateBinaryTree(width, height) {
        const node = findBinaryTreeNode(binary_tree, width, height);

        if (!node) {
          return null;
        }

        return splitBinaryTreeNode(node, width, height);
      }

      function allocateGrid(width, height) {
        const cell_width = Math.ceil(width / GRID_CELL_SIZE);
        const cell_height = Math.ceil(height / GRID_CELL_SIZE);

        for (let cell_y = 0; cell_y <= GRID_SIZE - cell_height; cell_y += 1) {
          for (let cell_x = 0; cell_x <= GRID_SIZE - cell_width; cell_x += 1) {
            let fits = true;

            for (let offset_y = 0; offset_y < cell_height && fits; offset_y += 1) {
              for (let offset_x = 0; offset_x < cell_width; offset_x += 1) {
                if (grid_cells[(cell_y + offset_y) * GRID_SIZE + cell_x + offset_x]) {
                  fits = false;
                  break;
                }
              }
            }

            if (fits) {
              for (let offset_y = 0; offset_y < cell_height; offset_y += 1) {
                for (let offset_x = 0; offset_x < cell_width; offset_x += 1) {
                  grid_cells[(cell_y + offset_y) * GRID_SIZE + cell_x + offset_x] = true;
                }
              }

              return {
                x: cell_x * GRID_CELL_SIZE,
                y: cell_y * GRID_CELL_SIZE,
                width,
                height,
              };
            }
          }
        }

        return null;
      }

      function nextPowerOfTwo(size) {
        let power = 1;

        while (power < size) {
          power *= 2;
        }

        return power;
      }

      function splitBuddyNode(node) {
        const child_size = node.size / 2;

        node.children = [
          { x: node.x, y: node.y, size: child_size },
          { x: node.x + child_size, y: node.y, size: child_size },
          { x: node.x, y: node.y + child_size, size: child_size },
          { x: node.x + child_size, y: node.y + child_size, size: child_size },
        ];
      }

      function findBuddyNode(node, block_size) {
        if (node.used) {
          return null;
        }

        if (node.children) {
          for (const child of node.children) {
            const match = findBuddyNode(child, block_size);

            if (match) {
              return match;
            }
          }

          return null;
        }

        if (node.size < block_size) {
          return null;
        }

        if (node.size === block_size) {
          return node;
        }

        splitBuddyNode(node);

        return findBuddyNode(node, block_size);
      }

      function allocateBuddy(width, height) {
        const block_size = nextPowerOfTwo(Math.max(width, height));
        const node = findBuddyNode(buddy_tree, block_size);

        if (!node) {
          return null;
        }

        node.used = true;

        return {
          x: node.x,
          y: node.y,
          width,
          height,
        };
      }

      function allocate(width, height) {
        if (algorithm_select.value === "shelf-best-fit") {
          return allocateShelfBestFit(width, height);
        }

        if (algorithm_select.value === "skyline") {
          return allocateSkyline(width, height);
        }

        if (algorithm_select.value === "skyline-best-fit") {
          return allocateSkylineBestFit(width, height);
        }

        if (algorithm_select.value === "guillotine") {
          return allocateGuillotine(width, height);
        }

        if (algorithm_select.value === "max-rects") {
          return allocateMaxRects(width, height);
        }

        if (algorithm_select.value === "binary-tree") {
          return allocateBinaryTree(width, height);
        }

        if (algorithm_select.value === "grid") {
          return allocateGrid(width, height);
        }

        if (algorithm_select.value === "buddy") {
          return allocateBuddy(width, height);
        }

        return allocateShelf(width, height);
      }

      function resetAllocatorState() {
        current_x = 0;
        current_y = 0;
        shelf_height = 0;
        shelves = [];
        shelves_y = 0;
        skyline = [{ x: 0, y: 0, width: ATLAS_SIZE }];
        free_rects = [{ x: 0, y: 0, width: ATLAS_SIZE, height: ATLAS_SIZE }];
        max_rects = [{ x: 0, y: 0, width: ATLAS_SIZE, height: ATLAS_SIZE }];
        binary_tree = { x: 0, y: 0, width: ATLAS_SIZE, height: ATLAS_SIZE };
        grid_cells = createGridCells();
        buddy_tree = { x: 0, y: 0, size: ATLAS_SIZE };
        free_holes = [];
        rect_count = 0;
        occupied_area = 0;
      }

      function resetAllocator() {
        resetAllocatorState();
        placed_rects = [];
        atlas.replaceChildren();
        add_button.disabled = false;
        fill_button.disabled = false;
        status.textContent = `0 rectángulos; ${occupiedLabel()}`;
      }

      function removeRectangle(rect_data) {
        const index = placed_rects.indexOf(rect_data);

        if (index === -1) {
          return;
        }

        placed_rects.splice(index, 1);
        rect_data.element.remove();
        addFreeHole(rect_data.placement);
        rect_count -= 1;
        occupied_area -= rect_data.width * rect_data.height;
        status.textContent = `${rect_count} rectángulos; ${occupiedLabel()}`;
      }

      function drawRectangle(rect_data, placement) {
        const rect = document.createElement("div");
        rect.className = "rect";
        rect.style.left = `${placement.x}px`;
        rect.style.top = `${placement.y}px`;
        rect.style.width = `${placement.width}px`;
        rect.style.height = `${placement.height}px`;
        rect.style.background = rect_data.color;
        rect.textContent = `${placement.width}x${placement.height}`;
        rect.addEventListener("click", () => removeRectangle(rect_data));

        rect_data.element = rect;
        atlas.append(rect);
      }

      function placeRectangle(rect_data) {
        const placement = allocateFreeHole(rect_data.width, rect_data.height) || allocate(rect_data.width, rect_data.height);

        if (!placement) {
          status.textContent = `${rect_count} rectángulos; ${occupiedLabel()}`;
          return false;
        }

        rect_count += 1;
        occupied_area += placement.width * placement.height;
        rect_data.placement = placement;

        drawRectangle(rect_data, placement);
        status.textContent = `${rect_count} rectángulos; ${occupiedLabel()}`;

        return true;
      }

      function addRectangle(min_size = MIN_RECT_SIZE, max_size = MAX_RECT_SIZE) {
        const rect_data = {
          width: randomSize(min_size, max_size),
          height: randomSize(min_size, max_size),
          color: randomColor(),
        };

        if (!placeRectangle(rect_data)) {
          return false;
        }

        placed_rects.push(rect_data);

        return true;
      }

      function fillAtlas() {
        resetAllocator();

        const initial_count = rect_count;

        while (addRectangle()) {}

        const added_count = rect_count - initial_count;
        const added_label = added_count === 1 ? "1 añadido" : `${added_count} añadidos`;

        status.textContent = `${added_label}; ${occupiedLabel()}`;
      }

      algorithm_select.addEventListener("change", resetAllocator);
      add_button.addEventListener("click", () => addRectangle());
      for (const button of size_range_buttons) {
        button.addEventListener("click", () => {
          const [min_size, max_size] = button.dataset.sizeRange.split(",").map(Number);

          addRectangle(min_size, max_size);
        });
      }
      fill_button.addEventListener("click", fillAtlas);
    </script>
  </body>
</html>
