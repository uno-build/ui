<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Solid components</title>
        <style>
            @font-face {
                font-family: 'Poppins-Regular';
                src: url('assets/fonts/Poppins-Regular.ttf') format('truetype');
                font-weight: normal;
                font-style: normal;
            }
            @font-face {
                font-family: 'ChangaOne-Regular';
                src: url('assets/fonts/ChangaOne-Regular.ttf') format('truetype');
                font-weight: normal;
                font-style: normal;
            }
            @font-face {
                font-family: 'Nougat-ExtraBlack';
                src: url('assets/fonts/Nougat-ExtraBlack.ttf') format('truetype');
                font-weight: normal;
                font-style: normal;
            }

            html,
            body {
                margin: 0;
                width: 100%;
                height: 100%;
                overflow: hidden;
                overscroll-behavior: none;
                font-family: 'Poppins-Regular', 'ChangaOne-Regular', system-ui, sans-serif;
                background-color: #eaf4fb;
                color: #1f3b77;
            }

            #root {
                position: fixed;
                inset: 0;
                overflow: hidden;
            }
            #root > * {
                display: flex;
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                height: 100%;
            }

            canvas {
                touch-action: none;
            }

            body #settings-panel {
                background: #ffffff;
                color: #1f3b77;
            }
            #settings-panel .settings-renderer-opacity {
                color: #518ac8;
            }
            #settings-panel input {
                accent-color: #4377bb;
            }

            .settings-examples-title {
                margin-top: 8px;
                padding-top: 8px;
                border-top: 1px solid #c7dfef;
            }
            .settings-example {
                display: block;
                padding: 2px 0;
                color: inherit;
                text-decoration: none;
            }
            .settings-example:hover {
                text-decoration: underline;
            }
            .settings-example[aria-current='page'] {
                color: #4377bb;
            }
        </style>
    </head>
    <body>
        <div id="root"></div>
        <div id="settings-panel">
            <div class="settings-panel-title">Renderers</div>
            <div id="settings-renderers"></div>
            <div class="settings-panel-title settings-examples-title">Examples</div>
            <div id="settings-examples"></div>
        </div>
        <script type="module">
            import ResourcesDom from '../../src/renderer/dom/ResourcesDom'
            import ResourcesWebGPU from '../../src/renderer/webgpu/ResourcesWebGPU'
            import UIDom from '../../src/ui/UIDom'
            import UI from '../../src/ui/UI'
            import { initSettingsPanel } from '../shared/settings/settings-panel'

            const EXAMPLES = {
                // input: () => import('./input'),
                // image: () => import('./image'),
                scrollview: () => import('./scrollview'),
                todo: () => import('./todo'),
                'todo-babylonlite': () => import('./todo-babylonlite'),
            }
            const RENDERERS = {
                RendererDom: { element: document.createElement('div'), ui_class: UIDom, resources_class: ResourcesDom },
                RendererWebGPU: {
                    element: document.createElement('canvas'),
                    ui_class: UI,
                    resources_class: ResourcesWebGPU,
                },
            }
            const root = document.getElementById('root')
            const settings_examples = document.getElementById('settings-examples')
            const requested_example_name = new URLSearchParams(location.search).get('example')
            const example_name = Object.hasOwn(EXAMPLES, requested_example_name) ? requested_example_name : 'scrollview'

            for (const [renderer_name, setup] of Object.entries(RENDERERS)) {
                setup.element.id = renderer_name
            }

            for (const available_example_name of Object.keys(EXAMPLES)) {
                const example_url = new URL(window.location.href)
                example_url.searchParams.set('example', available_example_name)

                const example_link = document.createElement('a')
                example_link.className = 'settings-example'
                example_link.href = example_url.href
                example_link.textContent = available_example_name
                if (available_example_name === example_name) {
                    example_link.ariaCurrent = 'page'
                }
                settings_examples.appendChild(example_link)
            }

            initSettingsPanel({ root })

            if (example_name === 'todo-babylonlite') {
                const [{ main }, { default: UIBabylonLite }, { loadImage, loadJson }] = await Promise.all([
                    EXAMPLES[example_name](),
                    import('../../src/ui/UIBabylonLite'),
                    import('../shared/load-assets'),
                ])
                const canvas = RENDERERS.RendererWebGPU.element
                root.appendChild(canvas)
                await main({ canvas, ResourcesWebGPU, UIBabylonLite, loadImage, loadJson })
            } else {
                const { default: createExample } = await EXAMPLES[example_name]()
                const device_pixel_ratio = window.devicePixelRatio
                const uis = []

                for (const setup of Object.values(RENDERERS)) {
                    const { element } = setup
                    const is_canvas = element instanceof HTMLCanvasElement
                    root.appendChild(element)

                    const resources = await setup.resources_class.create({ canvas: element })
                    const { ui } = await setup.ui_class.create({ resources, device_pixel_ratio })

                    function syncRendererSize() {
                        const width = root.clientWidth
                        const height = root.clientHeight

                        if (is_canvas) {
                            element.width = Math.max(1, Math.round(width * device_pixel_ratio))
                            element.height = Math.max(1, Math.round(height * device_pixel_ratio))
                        }

                        ui.setViewport(width, height)
                        ui.setDevicePixelRatio(device_pixel_ratio)
                        ui.update()
                    }

                    syncRendererSize()
                    window.addEventListener('resize', syncRendererSize)

                    await createExample({ ui, resources })
                    uis.push(ui)
                }

                requestAnimationFrame(function render() {
                    uis.forEach((ui) => ui.draw())
                    requestAnimationFrame(render)
                })
            }
        </script>
    </body>
</html>
