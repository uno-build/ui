<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <style>
            html,
            body {
                margin: 0;
                width: 100%;
                height: 100%;
                overflow: hidden;
            }

            canvas {
                display: block;
                width: 100%;
                height: 100%;
            }
        </style>
    </head>
    <body>
        <canvas></canvas>
        <script type="module">
            import UI from '../src/UI'
            import RendererWebGPU from '../src/renderer/RendererWebGPU'
            import RendererThree from '../src/renderer/RendererThree'
            import RendererThreeWorldSpace from '../src/renderer/RendererThreeWorldSpace'
            import { loadImage, loadJson } from '../src/utils/load-assets'
            import { loadYoga } from 'yoga-layout/load'
            import { main } from './three.ts'

            const canvas = document.querySelector('canvas')
            const onCanvasEvent = window.addEventListener
            main({
                canvas,
                onCanvasEvent,
                UI,
                RendererWebGPU,
                RendererThree,
                RendererThreeWorldSpace,
                loadImage,
                loadJson,
                loadYoga,
            }).catch(console.error)
        </script>
    </body>
</html>
