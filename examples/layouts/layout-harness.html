<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <base href="/" />
        <script type="module" src="/examples/layouts/layout-runner.ts"></script>
        <script type="module">
            import { FONT_NAME2, FONT_NAME1, registerDomFonts } from '/examples/shared/assets.ts'
            registerDomFonts([FONT_NAME2, FONT_NAME1])
        </script>
        <style>
            html,
            body {
                margin: 0;
                width: 100%;
                height: 100%;
                overflow: hidden;
            }

            #root {
                position: fixed;
                inset: 0;
                width: 100vw;
                height: 100vh;
                overflow: hidden;
            }

            #RendererDom::-webkit-scrollbar,
            #RendererDom *::-webkit-scrollbar {
                width: 0;
                height: 0;
            }
        </style>
    </head>
    <body>
        <div id="root"></div>
    </body>
</html>
