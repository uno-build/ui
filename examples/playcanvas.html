<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <style>
            html,
            body {
                margin: 0;
                width: 100%;
                height: 100%;
                overflow: hidden;
            }

            canvas {
                display: block;
                width: 100%;
                height: 100%;
            }
        </style>
    </head>
    <body>
        <canvas></canvas>
        <script type="module">
            import UIWebGPU from '../src/ui/UIWebGPU'
            import ResourcesWebGPU from '../src/renderer/webgpu/ResourcesWebGPU'
            import { loadImage, loadJson } from '../tests/utils/load-assets'
            import { loadYoga } from 'yoga-layout/load'
            import { main } from './playcanvas.ts'

            const canvas = document.querySelector('canvas')
            const onCanvasEvent = window.addEventListener
            main({
                canvas,
                onCanvasEvent,
                UIWebGPU,
                ResourcesWebGPU,
                loadImage,
                loadJson,
                loadYoga,
            }).catch(console.error)
        </script>
    </body>
</html>
