<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <style>
            html,
            body {
                margin: 0;
                width: 100%;
                height: 100%;
                overflow: hidden;
            }

            canvas {
                display: block;
                width: 100%;
                height: 100%;
            }
        </style>
    </head>
    <body>
        <canvas></canvas>
        <script type="module">
            import UI from '../../src/ui/UI'
            import ResourcesWebGPU from '../../src/renderer/webgpu/ResourcesWebGPU'

            const canvas = document.querySelector('canvas')
            const resources = await ResourcesWebGPU.create({ canvas })
            const { ui } = await UI.create({ resources })

            ui.root.style('alignItems', 'center')
            ui.root.style('justifyContent', 'center')
            ui.root.style('gap', '16px')

            const panel = ui.create()
            panel.style('width', '250px')
            panel.style('height', '150px')
            panel.style('backgroundColor', '#8080FD')
            ui.root.add(panel)

            function onResize() {
                const { clientWidth: width, clientHeight: height } = canvas
                canvas.width = width * window.devicePixelRatio
                canvas.height = height * window.devicePixelRatio
                ui.setViewport(width, height)
                ui.setDevicePixelRatio(window.devicePixelRatio)
                ui.update()
            }
            window.addEventListener('resize', onResize)
            onResize()

            requestAnimationFrame(function render() {
                ui.draw()
                requestAnimationFrame(render)
            })
        </script>
    </body>
</html>
