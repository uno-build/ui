<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Octane universal renderer</title>
        <style>
            html,
            body {
                margin: 0;
                width: 100%;
                height: 100%;
                overflow: hidden;
            }

            canvas {
                display: block;
                width: 100%;
                height: 100%;
            }
        </style>
    </head>
    <body>
        <canvas></canvas>
        <script type="module">
            import { createUniversalRendererRoot } from '../src/components/octane/index.js'
            import { BasicComponent } from './octane'
            import UIWebGPU from '../src/ui/UIWebGPU'
            import WebGPUResources from '../src/renderer/webgpu/WebGPUResources'
            import { loadImage, loadJson } from '../tests/utils/load-assets'
            import { loadYoga } from 'yoga-layout/load'

            async function main() {
                const canvas = document.querySelector('canvas')
                const onCanvasEvent = window.addEventListener
                const webgpu = await WebGPUResources.create({ canvas })
                const device_pixel_ratio = window.devicePixelRatio
                const { ui } = await UIWebGPU.create({ webgpu, loadYoga, device_pixel_ratio })
                const { device, context, format } = webgpu

                function syncCanvasSize() {
                    const width = canvas.clientWidth
                    const height = canvas.clientHeight
                    canvas.width = Math.max(1, Math.round(width * device_pixel_ratio))
                    canvas.height = Math.max(1, Math.round(height * device_pixel_ratio))
                    ui.setViewport(width, height)
                    ui.setDevicePixelRatio(device_pixel_ratio)
                    ui.update()
                }

                syncCanvasSize()
                onCanvasEvent('resize', syncCanvasSize)

                requestAnimationFrame(function render() {
                    ui.draw()
                    requestAnimationFrame(render)
                })

                // Octane
                const renderer = createUniversalRendererRoot({ ui })
                renderer.render(BasicComponent, {})
                // renderer.unmount()
            }

            main()
        </script>
    </body>
</html>
