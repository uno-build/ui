<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Octane universal renderer</title>
    </head>
    <body>
        <script type="module">
            import { createUniversalRendererRoot } from '../src/components/octane/index.js'
            import { BasicComponent } from './octane'

            const node = () => ({
                add: () => {},
                remove: () => {},
                style: () => {},
            })
            const ui = {
                create: () => node(),
                update: () => {},
            }

            const renderer = createUniversalRendererRoot({ ui })

            renderer.render(BasicComponent, {})
            // renderer.unmount()
        </script>
    </body>
</html>
